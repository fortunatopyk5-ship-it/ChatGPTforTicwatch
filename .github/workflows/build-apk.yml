name: Build Wear OS APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WristGPT-Bridge-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish public direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" WristGPT-TicWatch-Pro5-Experimental.apk
          if gh release view v0.2-experimental >/dev/null 2>&1; then
            gh release upload v0.2-experimental WristGPT-TicWatch-Pro5-Experimental.apk --clobber
          else
            gh release create v0.2-experimental WristGPT-TicWatch-Pro5-Experimental.apk \
              --title "WristGPT Bridge 0.2 — Experimental Wear OS" \
              --notes "Experimental keyboard-first Wear OS bridge. No OpenAI API key needed. Requires the original ChatGPT Android app installed and signed in separately; compatibility with Google sign-in on Wear OS is NOT guaranteed. Accessibility-based automation may fail. Built as a debug APK, not officially supported by OpenAI." \
              --prerelease --target main
          fi
